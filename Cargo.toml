[workspace]
members = ["germalcat-core", "germalcat"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Germal Cat"]
license = "MIT"

[workspace.dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
chrono     = { version = "0.4", features = ["serde"] }
anyhow     = "1"
tracing    = "0.1"
tokio      = { version = "1", features = ["full"] }
dirs       = "5"
